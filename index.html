<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Assignment & Attendance Management System</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        :root {
            --primary: #6366f1;
            --primary-dark: #4f46e5;
            --secondary: #ec4899;
            --success: #10b981;
            --warning: #f59e0b;
            --danger: #ef4444;
            --bg: #0f172a;
            --surface: #1e293b;
            --surface-light: #334155;
            --text: #f1f5f9;
            --text-muted: #cbd5e1;
            --border: #475569;
        }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: var(--bg);
            color: var(--text);
            line-height: 1.6;
        }
        
        .container {
            max-width: 1400px;
            margin: 0 auto;
            padding: 20px;
        }
        
        header {
            background: var(--surface);
            padding: 20px;
            border-radius: 8px;
            margin-bottom: 20px;
            border: 1px solid var(--border);
        }
        
        header h1 {
            font-size: 28px;
            margin-bottom: 10px;
        }
        
        header p {
            color: var(--text-muted);
            font-size: 14px;
        }
        
        .auth-view {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background: var(--bg);
        }
        
        .login-card {
            background: var(--surface);
            padding: 40px;
            border-radius: 12px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            width: 100%;
            max-width: 400px;
            border: 1px solid var(--border);
        }
        
        .login-card h2 {
            margin-bottom: 30px;
            text-align: center;
            font-size: 24px;
        }
        
        .form-group {
            margin-bottom: 20px;
        }
        
        label {
            display: block;
            margin-bottom: 8px;
            font-weight: 500;
            color: var(--text);
        }
        
        input, select, textarea {
            width: 100%;
            padding: 12px;
            background: var(--surface-light);
            border: 1px solid var(--border);
            border-radius: 6px;
            color: var(--text);
            font-size: 14px;
        }
        
        input:focus, select:focus, textarea:focus {
            outline: none;
            border-color: var(--primary);
            box-shadow: 0 0 0 3px rgba(99, 102, 241, 0.1);
        }
        
        .btn {
            padding: 12px 24px;
            border: none;
            border-radius: 6px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            display: inline-block;
        }
        
        .btn-primary {
            background: var(--primary);
            color: white;
            width: 100%;
            margin-top: 10px;
        }
        
        .btn-primary:hover {
            background: var(--primary-dark);
            transform: translateY(-2px);
        }
        
        .btn-secondary {
            background: var(--surface-light);
            color: var(--text);
            border: 1px solid var(--border);
        }
        
        .btn-secondary:hover {
            background: var(--border);
        }
        
        .btn-danger {
            background: var(--danger);
            color: white;
        }
        
        .btn-danger:hover {
            background: #dc2626;
        }
        
        .btn-success {
            background: var(--success);
            color: white;
        }
        
        .btn-success:hover {
            background: #059669;
        }
        
        .dashboard-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }
        
        .card {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 8px;
            padding: 20px;
        }
        
        .card h3 {
            margin-bottom: 15px;
            color: var(--primary);
            font-size: 18px;
        }
        
        .card-info {
            display: flex;
            justify-content: space-between;
            margin-bottom: 10px;
            padding-bottom: 10px;
            border-bottom: 1px solid var(--border);
        }
        
        .card-info label {
            margin: 0;
            color: var(--text-muted);
            font-weight: 400;
        }
        
        .card-info span {
            color: var(--text);
            font-weight: 600;
        }
        
        .tabs {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
            border-bottom: 1px solid var(--border);
        }
        
        .tab-btn {
            padding: 12px 20px;
            background: transparent;
            border: none;
            border-bottom: 2px solid transparent;
            color: var(--text-muted);
            cursor: pointer;
            transition: all 0.3s ease;
            font-weight: 500;
        }
        
        .tab-btn.active {
            color: var(--primary);
            border-bottom-color: var(--primary);
        }
        
        .tab-content {
            display: none;
        }
        
        .tab-content.active {
            display: block;
        }
        
        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 15px;
        }
        
        th, td {
            padding: 12px;
            text-align: left;
            border-bottom: 1px solid var(--border);
        }
        
        th {
            background: var(--surface-light);
            font-weight: 600;
            color: var(--text);
        }
        
        tr:hover {
            background: var(--surface-light);
        }
        
        .status-badge {
            display: inline-block;
            padding: 4px 12px;
            border-radius: 12px;
            font-size: 12px;
            font-weight: 600;
        }
        
        .status-approved {
            background: rgba(16, 185, 129, 0.2);
            color: var(--success);
        }
        
        .status-pending {
            background: rgba(245, 158, 11, 0.2);
            color: var(--warning);
        }
        
        .status-rejected {
            background: rgba(239, 68, 68, 0.2);
            color: var(--danger);
        }
        
        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0, 0, 0, 0.5);
            justify-content: center;
            align-items: center;
            z-index: 1000;
        }
        
        .modal.active {
            display: flex;
        }
        
        .modal-content {
            background: var(--surface);
            padding: 30px;
            border-radius: 12px;
            max-width: 600px;
            width: 90%;
            max-height: 90vh;
            overflow-y: auto;
            border: 1px solid var(--border);
        }
        
        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }
        
        .modal-header h2 {
            margin: 0;
        }
        
        .close-btn {
            background: none;
            border: none;
            color: var(--text-muted);
            font-size: 24px;
            cursor: pointer;
        }
        
        .image-preview {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(100px, 1fr));
            gap: 10px;
            margin-top: 10px;
        }
        
        .image-item {
            position: relative;
            border-radius: 6px;
            overflow: hidden;
            background: var(--surface-light);
            aspect-ratio: 1;
        }
        
        .image-item img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
        
        .image-item .remove-btn {
            position: absolute;
            top: 4px;
            right: 4px;
            background: var(--danger);
            color: white;
            border: none;
            border-radius: 50%;
            width: 24px;
            height: 24px;
            cursor: pointer;
            font-size: 14px;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        
        .message {
            padding: 15px;
            border-radius: 6px;
            margin-bottom: 15px;
            display: none;
        }
        
        .message.show {
            display: block;
        }
        
        .message.success {
            background: rgba(16, 185, 129, 0.2);
            color: var(--success);
            border: 1px solid var(--success);
        }
        
        .message.error {
            background: rgba(239, 68, 68, 0.2);
            color: var(--danger);
            border: 1px solid var(--danger);
        }
        
        .message.info {
            background: rgba(99, 102, 241, 0.2);
            color: var(--primary);
            border: 1px solid var(--primary);
        }
        
        @media (max-width: 1180px) {
            .dashboard-grid {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>
    <!-- Auth View -->
    <div id="authView" class="auth-view">
        <div class="login-card">
            <h2>로그인</h2>
            <div class="form-group">
                <label>직원 아이디</label>
                <input type="text" id="loginId" placeholder="예: 관리자">
            </div>
            <div class="form-group">
                <label>비밀번호</label>
                <input type="password" id="loginPassword" placeholder="비밀번호 입력">
            </div>
            <button class="btn btn-primary" onclick="handleLogin()">로그인</button>
            <div id="loginMsg" style="margin-top: 15px; text-align: center; color: var(--text-muted);"></div>
        </div>
    </div>
    
    <!-- Main App -->
    <div id="appView" style="display: none;">
        <header>
            <div style="display: flex; justify-content: space-between; align-items: center;">
                <div>
                    <h1>📋 출퇴근 & 과제 관리</h1>
                    <p id="userInfo"></p>
                </div>
                <button class="btn btn-secondary" onclick="handleLogout()">로그아웃</button>
            </div>
        </header>
        
        <div class="container">
            <div class="tabs">
                <button class="tab-btn active" onclick="switchTab('dashboard')">대시보드</button>
                <button class="tab-btn" onclick="switchTab('attendance')">출퇴근</button>
                <button class="tab-btn" onclick="switchTab('assignments')">과제</button>
                <button class="tab-btn" onclick="switchTab('submissions')">제출</button>
                <button class="tab-btn" onclick="switchTab('admin')">관리</button>
            </div>
            
            <!-- Dashboard Tab -->
            <div id="dashboard" class="tab-content active">
                <div class="dashboard-grid">
                    <div class="card">
                        <h3>👤 내 정보</h3>
                        <div class="card-info">
                            <label>이름:</label>
                            <span id="dashName">-</span>
                        </div>
                        <div class="card-info">
                            <label>직책:</label>
                            <span id="dashRole">-</span>
                        </div>
                        <div class="card-info">
                            <label>소속:</label>
                            <span id="dashCategory">-</span>
                        </div>
                    </div>
                    
                    <div class="card">
                        <h3>📅 출퇴근 현황</h3>
                        <div class="card-info">
                            <label>오늘 출근:</label>
                            <span id="dashCheckIn">-</span>
                        </div>
                        <div class="card-info">
                            <label>오늘 퇴근:</label>
                            <span id="dashCheckOut">-</span>
                        </div>
                        <div class="card-info">
                            <label>근무 상태:</label>
                            <span id="dashStatus">-</span>
                        </div>
                    </div>
                    
                    <div class="card">
                        <h3>📊 연차 현황</h3>
                        <div class="card-info">
                            <label>연차 총수:</label>
                            <span id="dashAnnualTotal">0</span>
                        </div>
                        <div class="card-info">
                            <label>사용 연차:</label>
                            <span id="dashAnnualUsed">0</span>
                        </div>
                        <div class="card-info">
                            <label>남은 연차:</label>
                            <span id="dashAnnualRemaining">0</span>
                        </div>
                    </div>
                </div>
            </div>
            
            <!-- Attendance Tab -->
            <div id="attendance" class="tab-content">
                <div class="card">
                    <h3>⏰ 출퇴근</h3>
                    <div style="display: flex; gap: 10px;">
                        <button class="btn btn-success" onclick="checkIn()" style="flex: 1;">✅ 출근</button>
                        <button class="btn btn-danger" onclick="checkOut()" style="flex: 1;">🚪 퇴근</button>
                    </div>
                    <div id="attendanceMsg" class="message" style="margin-top: 15px;"></div>
                    <table>
                        <thead>
                            <tr>
                                <th>날짜</th>
                                <th>출근</th>
                                <th>퇴근</th>
                                <th>상태</th>
                            </tr>
                        </thead>
                        <tbody id="attendanceList"></tbody>
                    </table>
                </div>
                
                <div class="card" style="margin-top: 20px;">
                    <h3>📝 연차 신청</h3>
                    <div class="form-group">
                        <label>신청 사유</label>
                        <textarea id="leaveReason" rows="3" placeholder="연차 신청 사유를 입력하세요"></textarea>
                    </div>
                    <button class="btn btn-primary" onclick="requestLeave()">연차 신청</button>
                    <div id="leaveMsg" class="message" style="margin-top: 15px;"></div>
                </div>
            </div>
            
            <!-- Assignments Tab -->
            <div id="assignments" class="tab-content">
                <div class="card">
                    <h3>📋 주간 과제</h3>
                    <div id="assignmentsList"></div>
                </div>
            </div>
            
            <!-- Submissions Tab -->
            <div id="submissions" class="tab-content">
                <div class="card">
                    <h3>📤 과제 제출</h3>
                    <div id="submissionsList"></div>
                </div>
            </div>
            
            <!-- Admin Tab -->
            <div id="admin" class="tab-content">
                <div class="card">
                    <h3>⚙️ 관리자 도구</h3>
                    <div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 10px;">
                        <button class="btn btn-secondary" onclick="showAdminPanel('users')">직원 관리</button>
                        <button class="btn btn-secondary" onclick="showAdminPanel('assignments')">과제 관리</button>
                        <button class="btn btn-secondary" onclick="showAdminPanel('attendance')">출퇴근 관리</button>
                        <button class="btn btn-secondary" onclick="showAdminPanel('backup')">백업</button>
                    </div>
                </div>
                
                <div id="adminPanel" class="card" style="margin-top: 20px; display: none;">
                    <div id="adminContent"></div>
                </div>
            </div>
        </div>
    </div>
    
    <!-- Modal -->
    <div id="modal" class="modal">
        <div class="modal-content">
            <div class="modal-header">
                <h2 id="modalTitle"></h2>
                <button class="close-btn" onclick="closeModal()">✕</button>
            </div>
            <div id="modalBody"></div>
        </div>
    </div>

    <script>
        // ===== Supabase Setup =====
        const SUPABASE_URL = "https://ylxshpuskimbaipscumx.supabase.co";
        const SUPABASE_ANON_KEY = "sb_publishable_EAGv5dX3Wf621_5P4_biVg_x4u-KguI";
        const SUPABASE_STORAGE_BUCKET = "assignment-images";
        
        const { createClient } = supabase;
        const supabaseClient = createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
        
        // ===== Global State =====
        let currentUser = null;
        let users = [];
        let assignments = [];
        let submissions = [];
        let attendance = [];
        let holidays = [];
        let useSupabase = false;
        
        // ===== Constants =====
        const USERS_KEY = 'mvp_users_v9';
        const ASSIGNMENTS_KEY = 'mvp_assignments_v9';
        const SUBMISSIONS_KEY = 'mvp_submissions_v9';
        const ATTENDANCE_KEY = 'mvp_attendance_v9';
        const HOLIDAYS_KEY = 'mvp_holidays_v9';
        
        const categoryLabel = { A: 'A팀', B: 'B팀', C: 'C팀', D: 'D팀' };
        const dayLabel = ['일', '월', '화', '수', '목', '금', '토'];
        
        // ===== Initialize =====
        async function init() {
            await loadAllData();
            const loginId = new URLSearchParams(window.location.search).get('loginId');
            const password = new URLSearchParams(window.location.search).get('password');
            if (loginId && password) {
                document.getElementById('loginId').value = loginId;
                document.getElementById('loginPassword').value = password;
                await handleLogin();
            }
        }
        
        // ===== Data Management =====
        async function loadAllData() {
            try {
                users = await load(USERS_KEY, initializeDefaultUsers());
                assignments = await load(ASSIGNMENTS_KEY, []);
                submissions = await load(SUBMISSIONS_KEY, []);
                attendance = await load(ATTENDANCE_KEY, []);
                holidays = await load(HOLIDAYS_KEY, []);
            } catch (e) {
                console.warn('Data load error:', e);
            }
        }
        
        async function load(key, fallback) {
            try {
                if (useSupabase) {
                    const { data, error } = await supabaseClient
                        .from('app_data')
                        .select('value')
                        .eq('key', key)
                        .single();
                    if (data) {
                        const value = JSON.parse(data.value);
                        localStorage.setItem(key, JSON.stringify(value));
                        return value;
                    }
                }
            } catch (e) {
                console.warn('Supabase load failed, using local:', e);
            }
            
            const raw = localStorage.getItem(key);
            if (!raw) {
                localStorage.setItem(key, JSON.stringify(fallback));
                return JSON.parse(JSON.stringify(fallback));
            }
            return JSON.parse(raw);
        }
        
        async function save(key, value) {
            localStorage.setItem(key, JSON.stringify(value));
            try {
                if (useSupabase) {
                    const { error } = await supabaseClient
                        .from('app_data')
                        .upsert({ key, value: JSON.stringify(value) }, { onConflict: 'key' });
                    if (error) console.warn('Supabase save error:', error);
                }
            } catch (e) {
                console.warn('Supabase save failed:', e);
            }
        }
        
        // ===== Image Upload to Supabase Storage =====
        async function uploadImageToStorage(file, path) {
            try {
                const fileName = `${Date.now()}_${Math.random().toString(36).substr(2, 9)}_${file.name}`;
                const filePath = `${path}/${fileName}`;
                
                const { data, error } = await supabaseClient.storage
                    .from(SUPABASE_STORAGE_BUCKET)
                    .upload(filePath, file);
                
                if (error) throw error;
                
                const { data: urlData } = supabaseClient.storage
                    .from(SUPABASE_STORAGE_BUCKET)
                    .getPublicUrl(filePath);
                
                return {
                    name: file.name,
                    path: filePath,
                    url: urlData.publicUrl,
                    uploadedAt: new Date().toISOString()
                };
            } catch (e) {
                console.error('Image upload failed:', e);
                throw e;
            }
        }
        
        // ===== Authentication =====
        async function handleLogin() {
            const id = document.getElementById('loginId').value.trim();
            const pw = document.getElementById('loginPassword').value.trim();
            
            if (!id || !pw) {
                showMessage('loginMsg', '아이디와 비밀번호를 입력하세요', 'error');
                return;
            }
            
            const user = users.find(u => u.id === id && u.password === pw);
            if (!user) {
                showMessage('loginMsg', '아이디 또는 비밀번호가 잘못되었습니다', 'error');
                return;
            }
            
            currentUser = user;
            document.getElementById('authView').style.display = 'none';
            document.getElementById('appView').style.display = 'block';
            renderAll();
        }
        
        function handleLogout() {
            currentUser = null;
            document.getElementById('appView').style.display = 'none';
            document.getElementById('authView').style.display = 'flex';
            document.getElementById('loginId').value = '';
            document.getElementById('loginPassword').value = '';
        }
        
        // ===== UI Functions =====
        function switchTab(tabName) {
            document.querySelectorAll('.tab-content').forEach(el => el.classList.remove('active'));
            document.querySelectorAll('.tab-btn').forEach(el => el.classList.remove('active'));
            document.getElementById(tabName).classList.add('active');
            event.target.classList.add('active');
        }
        
        function showMessage(elementId, msg, type) {
            const el = document.getElementById(elementId);
            el.textContent = msg;
            el.className = `message show ${type}`;
            setTimeout(() => el.classList.remove('show'), 5000);
        }
        
        function openModal(title, content) {
            document.getElementById('modalTitle').textContent = title;
            document.getElementById('modalBody').innerHTML = content;
            document.getElementById('modal').classList.add('active');
        }
        
        function closeModal() {
            document.getElementById('modal').classList.remove('active');
        }
        
        // ===== Attendance Functions =====
        async function checkIn() {
            const today = new Date().toISOString().split('T')[0];
            const existing = attendance.find(a => a.userId === currentUser.id && a.date === today);
            
            if (existing && existing.checkIn) {
                showMessage('attendanceMsg', '이미 출근했습니다', 'info');
                return;
            }
            
            const now = new Date();
            if (existing) {
                existing.checkIn = `${String(now.getHours()).padStart(2, '0')}:${String(now.getMinutes()).padStart(2, '0')}`;
            } else {
                attendance.push({
                    userId: currentUser.id,
                    date: today,
                    checkIn: `${String(now.getHours()).padStart(2, '0')}:${String(now.getMinutes()).padStart(2, '0')}`,
                    checkOut: null,
                    status: '근무중',
                    leaveRequestedAt: null,
                    leaveApprovedAt: null,
                    leaveRejectedAt: null,
                    leaveApprovedBy: null
                });
            }
            
            await save(ATTENDANCE_KEY, attendance);
            renderAll();
            showMessage('attendanceMsg', '출근 처리되었습니다', 'success');
        }
        
        async function checkOut() {
            const today = new Date().toISOString().split('T')[0];
            const existing = attendance.find(a => a.userId === currentUser.id && a.date === today);
            
            if (!existing) {
                showMessage('attendanceMsg', '먼저 출근을 해주세요', 'error');
                return;
            }
            
            if (existing.checkOut) {
                showMessage('attendanceMsg', '이미 퇴근했습니다', 'info');
                return;
            }
            
            const now = new Date();
            existing.checkOut = `${String(now.getHours()).padStart(2, '0')}:${String(now.getMinutes()).padStart(2, '0')}`;
            existing.status = '퇴근';
            
            await save(ATTENDANCE_KEY, attendance);
            renderAll();
            showMessage('attendanceMsg', '퇴근 처리되었습니다', 'success');
        }
        
        async function requestLeave() {
            const reason = document.getElementById('leaveReason').value.trim();
            if (!reason) {
                showMessage('leaveMsg', '신청 사유를 입력하세요', 'error');
                return;
            }
            
            const today = new Date().toISOString().split('T')[0];
            const existing = attendance.find(a => a.userId === currentUser.id && a.date === today);
            
            if (!existing) {
                attendance.push({
                    userId: currentUser.id,
                    date: today,
                    checkIn: null,
                    checkOut: null,
                    status: '연차신청',
                    leaveRequestedAt: new Date().toISOString(),
                    leaveApprovedAt: null,
                    leaveRejectedAt: null,
                    leaveApprovedBy: null,
                    leaveReason: reason
                });
            } else {
                existing.status = '연차신청';
                existing.leaveRequestedAt = new Date().toISOString();
                existing.leaveReason = reason;
            }
            
            await save(ATTENDANCE_KEY, attendance);
            document.getElementById('leaveReason').value = '';
            renderAll();
            showMessage('leaveMsg', '연차가 신청되었습니다', 'success');
        }
        
        // ===== Render Functions =====
        function renderAll() {
            if (currentUser?.role === 'admin') {
                renderAdminDashboard();
            } else {
                renderWorkerDashboard();
            }
            renderAttendance();
            renderAssignments();
            renderSubmissions();
        }
        
        function renderWorkerDashboard() {
            const today = new Date().toISOString().split('T')[0];
            const todayAttendance = attendance.find(a => a.userId === currentUser.id && a.date === today);
            
            document.getElementById('userInfo').textContent = `${currentUser.name} (${categoryLabel[currentUser.category] || '-'})`;
            document.getElementById('dashName').textContent = currentUser.name;
            document.getElementById('dashRole').textContent = currentUser.role === 'admin' ? '관리자' : '직원';
            document.getElementById('dashCategory').textContent = categoryLabel[currentUser.category] || '-';
            document.getElementById('dashCheckIn').textContent = todayAttendance?.checkIn || '-';
            document.getElementById('dashCheckOut').textContent = todayAttendance?.checkOut || '-';
            document.getElementById('dashStatus').textContent = todayAttendance?.status || '미기록';
            
            const approvedLeave = attendance.filter(a => a.userId === currentUser.id && a.leaveApprovedAt).length;
            document.getElementById('dashAnnualTotal').textContent = currentUser.annualLeaveTotal || 15;
            document.getElementById('dashAnnualUsed').textContent = approvedLeave;
            document.getElementById('dashAnnualRemaining').textContent = (currentUser.annualLeaveTotal || 15) - approvedLeave;
        }
        
        function renderAdminDashboard() {
            document.getElementById('userInfo').textContent = `${currentUser.name} (관리자)`;
        }
        
        function renderAttendance() {
            const userAttendance = attendance.filter(a => a.userId === currentUser.id).slice(-30);
            let html = '';
            
            userAttendance.forEach(a => {
                html += `
                    <tr>
                        <td>${a.date}</td>
                        <td>${a.checkIn || '-'}</td>
                        <td>${a.checkOut || '-'}</td>
                        <td><span class="status-badge status-${a.status === '퇴근' ? 'approved' : a.status === '연차신청' ? 'pending' : 'rejected'}">${a.status}</span></td>
                    </tr>
                `;
            });
            
            document.getElementById('attendanceList').innerHTML = html;
        }
        
        function renderAssignments() {
            const html = assignments.map((a, idx) => `
                <div style="margin-bottom: 15px; padding: 15px; background: var(--surface-light); border-radius: 6px;">
                    <h4>${a.title}</h4>
                    <p style="color: var(--text-muted); margin: 10px 0;">${a.description}</p>
                    <p style="color: var(--text-muted); font-size: 12px;">마감: ${a.dueDate}</p>
                </div>
            `).join('');
            
            document.getElementById('assignmentsList').innerHTML = html || '<p style="color: var(--text-muted);">과제가 없습니다</p>';
        }
        
        function renderSubmissions() {
            const userSubmissions = submissions.filter(s => s.userId === currentUser.id);
            const html = userSubmissions.map(s => `
                <div style="margin-bottom: 15px; padding: 15px; background: var(--surface-light); border-radius: 6px;">
                    <h4>${s.assignmentId}</h4>
                    <p style="color: var(--text-muted); margin: 10px 0;">이미지: ${s.images?.length || 0}장</p>
                    <p><span class="status-badge status-${s.status === 'approved' ? 'approved' : s.status === 'pending' ? 'pending' : 'rejected'}">${s.status}</span></p>
                    ${s.images?.length > 0 ? `
                        <div class="image-preview">
                            ${s.images.map(img => `<img src="${img.url}" style="width: 80px; height: 80px; object-fit: cover; border-radius: 4px;">`).join('')}
                        </div>
                    ` : ''}
                </div>
            `).join('');
            
            document.getElementById('submissionsList').innerHTML = html || '<p style="color: var(--text-muted);">제출이 없습니다</p>';
        }
        
        function showAdminPanel(type) {
            let content = '';
            
            if (type === 'users') {
                content = `
                    <h4>직원 관리</h4>
                    <table>
                        <thead>
                            <tr>
                                <th>아이디</th>
                                <th>이름</th>
                                <th>소속</th>
                                <th>직책</th>
                            </tr>
                        </thead>
                        <tbody>
                            ${users.map(u => `
                                <tr>
                                    <td>${u.id}</td>
                                    <td>${u.name}</td>
                                    <td>${categoryLabel[u.category] || '-'}</td>
                                    <td>${u.role === 'admin' ? '관리자' : '직원'}</td>
                                </tr>
                            `).join('')}
                        </tbody>
                    </table>
                `;
            }
            
            if (type === 'backup') {
                content = `
                    <h4>데이터 백업</h4>
                    <button class="btn btn-primary" onclick="downloadAllData()" style="width: 100%; margin-bottom: 10px;">📥 전체 데이터 다운로드 (JSON)</button>
                    <button class="btn btn-primary" onclick="downloadAttendanceExcel()" style="width: 100%; margin-bottom: 10px;">📊 출퇴근 데이터 다운로드 (XLSX)</button>
                `;
            }
            
            document.getElementById('adminContent').innerHTML = content;
            document.getElementById('adminPanel').style.display = 'block';
        }
        
        async function downloadAllData() {
            const data = {
                users,
                assignments,
                submissions,
                attendance,
                holidays,
                exportedAt: new Date().toISOString()
            };
            
            const blob = new Blob([JSON.stringify(data, null, 2)], { type: 'application/json' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = `backup-${new Date().toISOString().split('T')[0]}.json`;
            a.click();
        }
        
        async function downloadAttendanceExcel() {
            const sheet = attendance.map(a => ({
                '날짜': a.date,
                '직원': users.find(u => u.id === a.userId)?.name || '-',
                '출근': a.checkIn || '-',
                '퇴근': a.checkOut || '-',
                '상태': a.status || '-'
            }));
            
            const wb = XLSX.utils.book_new();
            XLSX.utils.book_append_sheet(wb, XLSX.utils.json_to_sheet(sheet), '출퇴근');
            XLSX.writeFile(wb, `attendance-${new Date().toISOString().split('T')[0]}.xlsx`);
        }
        
        // ===== Default Data =====
        function initializeDefaultUsers() {
            return [
                { id: '관리자', password: 'admin1234', name: '관리자', role: 'admin', category: 'A', workDays: [1,2,3,4,5], workStart: '09:00', workEnd: '18:00', annualLeaveTotal: 15 },
                { id: '김수연', password: '1234', name: '김수연', role: 'worker', category: 'A', workDays: [1,2,3,4,5], workStart: '09:00', workEnd: '18:00', annualLeaveTotal: 15 },
                { id: '이준호', password: '1234', name: '이준호', role: 'worker', category: 'B', workDays: [1,2,3,4,5], workStart: '09:00', workEnd: '18:00', annualLeaveTotal: 15 }
            ];
        }
        
        // ===== Initialize App =====
        init();
    </script>
</body>
