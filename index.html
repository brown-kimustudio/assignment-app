<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>과제 이미지 출퇴근 관리 v30</title>

  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;600;700&display=swap" rel="stylesheet">

  <!-- Main CSS -->
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

<div id="app">
  <!-- 라우터가 여기에 페이지를 렌더링합니다 -->
</div>

<!-- ===============================================================
     CORE MODULES
     순서 중요: constants → storage → auth → utils → migration → router
================================================================ -->
<script src="js/core/constants.js"></script>
<script src="js/core/storage.js"></script>
<script src="js/core/auth.js"></script>
<script src="js/core/utils.js"></script>
<script src="js/core/migration.js"></script>
<script src="js/core/router.js"></script>

<!-- ===============================================================
     UI COMPONENTS
================================================================ -->
<script src="js/ui/ui-components.js"></script>

<!-- ===============================================================
     PAGE MODULES — 관리자
================================================================ -->
<script src="js/pages/admin-dashboard.js"></script>
<script src="js/pages/admin-assignments.js"></script>
<script src="js/pages/admin-submissions.js"></script>
<script src="js/pages/admin-attendance.js"></script>
<script src="js/pages/admin-users.js"></script>
<script src="js/pages/admin-tools.js"></script>

<!-- ===============================================================
     PAGE MODULES — 직원
================================================================ -->
<script src="js/pages/emp-dashboard.js"></script>
<script src="js/pages/emp-assignments.js"></script>
<script src="js/pages/emp-submissions.js"></script>
<script src="js/pages/emp-account.js"></script>

<!-- ===============================================================
     MAIN APP BOOTSTRAP
================================================================ -->
<script>
(function() {
  'use strict';

  // ── 1. 마이그레이션 실행 ─────────────────────────────────────────
  Migration.run();

  // ── 2. 로그인 페이지 렌더러 ──────────────────────────────────────
  function renderLogin(container) {
    container.innerHTML = '';
    const page = document.createElement('div');
    page.id = 'login-page';

    // 기본 계정 힌트 수집
    const users = Storage.getUsers();
    const adminUser = users.find(u => u.role === ROLES.ADMIN);
    const empUser   = users.find(u => u.role === ROLES.EMPLOYEE);

    page.innerHTML = `
      <div class="login-box">
        <div class="login-logo">
          <div class="login-logo-icon">🎯</div>
          <div class="login-logo-title">과제 관리 시스템</div>
          <div class="login-logo-sub">Assignment Image Attendance v30</div>
        </div>
        <form class="login-form" id="login-form" autocomplete="off">
          <div class="form-group">
            <label>이메일</label>
            <input type="email" id="login-email" class="form-input"
              placeholder="이메일 입력" autocomplete="username"
              value="${adminUser ? adminUser.email : ''}">
          </div>
          <div class="form-group">
            <label>비밀번호</label>
            <input type="password" id="login-password" class="form-input"
              placeholder="비밀번호 입력" autocomplete="current-password">
          </div>
          <div id="login-error" class="login-err" style="display:none;"></div>
          <button type="submit" class="btn btn-primary" style="width:100%;justify-content:center;padding:11px;">
            로그인
          </button>
        </form>
        ${adminUser || empUser ? `
        <div class="login-demo">
          <p>⚡ 테스트 계정</p>
          ${adminUser ? `<p>관리자: <strong>${adminUser.email}</strong> / <strong>${adminUser.password}</strong></p>` : ''}
          ${empUser   ? `<p>직원: <strong>${empUser.email}</strong> / <strong>${empUser.password}</strong></p>` : ''}
        </div>` : ''}
      </div>`;

    container.appendChild(page);

    document.getElementById('login-form')?.addEventListener('submit', (e) => {
      e.preventDefault();
      const email    = document.getElementById('login-email').value.trim();
      const password = document.getElementById('login-password').value;
      const errEl    = document.getElementById('login-error');

      const result = Auth.login(email, password);
      if (result.ok) {
        errEl.style.display = 'none';
        const session = result.session;
        Router.go(session.role === ROLES.ADMIN ? 'admin-dashboard' : 'emp-dashboard');
      } else {
        errEl.textContent = result.msg;
        errEl.style.display = '';
      }
    });
  }

  // ── 3. 라우트 등록 ────────────────────────────────────────────────
  // 로그인
  Router.register('login', (app) => renderLogin(app));

  // 관리자 라우트
  Router.register('admin-dashboard',  (app) => pageAdminDashboard(app));
  Router.register('admin-assignments', (app) => pageAdminAssignments(app));
  Router.register('admin-submissions', (app) => pageAdminSubmissions(app));
  Router.register('admin-attendance', (app) => pageAdminAttendance(app));
  Router.register('admin-users',      (app) => pageAdminUsers(app));
  Router.register('admin-tools',      (app) => pageAdminTools(app));

  // 직원 라우트
  Router.register('emp-dashboard',    (app) => pageEmpDashboard(app));
  Router.register('emp-assignments',  (app) => pageEmpAssignments(app));
  Router.register('emp-submissions',  (app) => pageEmpSubmissions(app));
  Router.register('emp-account',      (app) => pageEmpAccount(app));

  // ── 4. 라우터 초기화 ─────────────────────────────────────────────
  Router.init();

})();
</script>

</body>
</html>
