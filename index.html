<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Assignment & Attendance Management System</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        :root {
            --primary: #6366f1;
            --primary-dark: #4f46e5;
            --secondary: #ec4899;
            --success: #10b981;
            --warning: #f59e0b;
            --danger: #ef4444;
            --bg: #0f172a;
            --surface: #1e293b;
            --surface-light: #334155;
            --text: #f1f5f9;
            --text-muted: #cbd5e1;
            --border: #475569;
        }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: var(--bg);
            color: var(--text);
            line-height: 1.6;
        }
        
        .container {
            max-width: 1400px;
            margin: 0 auto;
            padding: 20px;
        }
        
        header {
            background: var(--surface);
            padding: 20px;
            border-radius: 8px;
            margin-bottom: 20px;
            border: 1px solid var(--border);
        }
        
        header h1 {
            font-size: 28px;
            margin-bottom: 10px;
        }
        
        header p {
            color: var(--text-muted);
            font-size: 14px;
        }
        
        .auth-view {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background: var(--bg);
        }
        
        .login-card {
            background: var(--surface);
            padding: 40px;
            border-radius: 12px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            width: 100%;
            max-width: 400px;
            border: 1px solid var(--border);
        }
        
        .login-card h2 {
            margin-bottom: 30px;
            text-align: center;
            font-size: 24px;
        }
        
        .form-group {
            margin-bottom: 20px;
        }
        
        label {
            display: block;
            margin-bottom: 8px;
            font-weight: 500;
            color: var(--text);
        }
        
        input, select, textarea {
            width: 100%;
            padding: 12px;
            background: var(--surface-light);
            border: 1px solid var(--border);
            border-radius: 6px;
            color: var(--text);
            font-size: 14px;
        }
        
        input:focus, select:focus, textarea:focus {
            outline: none;
            border-color: var(--primary);
            box-shadow: 0 0 0 3px rgba(99, 102, 241, 0.1);
        }
        
        .btn {
            padding: 12px 24px;
            border: none;
            border-radius: 6px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            display: inline-block;
        }
        
        .btn-primary {
            background: var(--primary);
            color: white;
            width: 100%;
            margin-top: 10px;
        }
        
        .btn-primary:hover {
            background: var(--primary-dark);
            transform: translateY(-2px);
        }
        
        .btn-secondary {
            background: var(--surface-light);
            color: var(--text);
            border: 1px solid var(--border);
        }
        
        .btn-secondary:hover {
            background: var(--border);
        }
        
        .btn-danger {
            background: var(--danger);
            color: white;
        }
        
        .btn-danger:hover {
            background: #dc2626;
        }
        
        .btn-success {
            background: var(--success);
            color: white;
        }
        
        .btn-success:hover {
            background: #059669;
        }
        
        .dashboard-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }
        
        .card {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 8px;
            padding: 20px;
        }
        
        .card h3 {
            margin-bottom: 15px;
            color: var(--primary);
            font-size: 18px;
        }
        
        .card-info {
            display: flex;
            justify-content: space-between;
            margin-bottom: 10px;
            padding-bottom: 10px;
            border-bottom: 1px solid var(--border);
        }
        
        .card-info label {
            margin: 0;
            color: var(--text-muted);
            font-weight: 400;
        }
        
        .card-info span {
            color: var(--text);
            font-weight: 600;
        }
        
        .tabs {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
            border-bottom: 1px solid var(--border);
        }
        
        .tab-btn {
            padding: 12px 20px;
            background: transparent;
            border: none;
            border-bottom: 2px solid transparent;
            color: var(--text-muted);
            cursor: pointer;
            transition: all 0.3s ease;
            font-weight: 500;
        }
        
        .tab-btn.active {
            color: var(--primary);
            border-bottom-color: var(--primary);
        }
        
        .tab-content {
            display: none;
        }
        
        .tab-content.active {
            display: block;
        }
        
        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 15px;
        }
        
        th, td {
            padding: 12px;
            text-align: left;
            border-bottom: 1px solid var(--border);
        }
        
        th {
            background: var(--surface-light);
            font-weight: 600;
            color: var(--text);
        }
        
        tr:hover {
            background: var(--surface-light);
        }
        
        .status-badge {
            display: inline-block;
            padding: 4px 12px;
            border-radius: 12px;
            font-size: 12px;
            font-weight: 600;
        }
        
        .status-approved {
            background: rgba(16, 185, 129, 0.2);
            color: var(--success);
        }
        
        .status-pending {
            background: rgba(245, 158, 11, 0.2);
            color: var(--warning);
        }
        
        .status-rejected {
            background: rgba(239, 68, 68, 0.2);
            color: var(--danger);
        }
        
        .message {
            padding: 15px;
            border-radius: 6px;
            margin-bottom: 15px;
            display: none;
        }
        
        .message.show {
            display: block;
        }
        
        .message.success {
            background: rgba(16, 185, 129, 0.2);
            color: var(--success);
            border: 1px solid var(--success);
        }
        
        .message.error {
            background: rgba(239, 68, 68, 0.2);
            color: var(--danger);
            border: 1px solid var(--danger);
        }
        
        @media (max-width: 1180px) {
            .dashboard-grid {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>
    <div id="authView" class="auth-view">
        <div class="login-card">
            <h2>로그인</h2>
            <div class="form-group">
                <label>직원 아이디</label>
                <input type="text" id="loginId" placeholder="예: 관리자">
            </div>
            <div class="form-group">
                <label>비밀번호</label>
                <input type="password" id="loginPassword" placeholder="비밀번호">
            </div>
            <button class="btn btn-primary" onclick="handleLogin()">로그인</button>
            <div id="loginMsg" style="margin-top: 15px; text-align: center; color: var(--text-muted);"></div>
        </div>
    </div>
    
    <div id="appView" style="display: none;">
        <header>
            <div style="display: flex; justify-content: space-between; align-items: center;">
                <div>
                    <h1>📋 출퇴근 & 과제 관리</h1>
                    <p id="userInfo"></p>
                </div>
                <button class="btn btn-secondary" onclick="handleLogout()">로그아웃</button>
            </div>
        </header>
        
        <div class="container">
            <div class="tabs">
                <button class="tab-btn active" onclick="switchTab(event, 'dashboard')">대시보드</button>
                <button class="tab-btn" onclick="switchTab(event, 'attendance')">출퇴근</button>
                <button class="tab-btn" onclick="switchTab(event, 'admin')">관리</button>
            </div>
            
            <div id="dashboard" class="tab-content active">
                <div class="dashboard-grid">
                    <div class="card">
                        <h3>👤 내 정보</h3>
                        <div class="card-info">
                            <label>이름:</label>
                            <span id="dashName">-</span>
                        </div>
                        <div class="card-info">
                            <label>직책:</label>
                            <span id="dashRole">-</span>
                        </div>
                        <div class="card-info">
                            <label>소속:</label>
                            <span id="dashCategory">-</span>
                        </div>
                    </div>
                    
                    <div class="card">
                        <h3>📅 출퇴근 현황</h3>
                        <div class="card-info">
                            <label>오늘 출근:</label>
                            <span id="dashCheckIn">-</span>
                        </div>
                        <div class="card-info">
                            <label>오늘 퇴근:</label>
                            <span id="dashCheckOut">-</span>
                        </div>
                        <div class="card-info">
                            <label>근무 상태:</label>
                            <span id="dashStatus">-</span>
                        </div>
                    </div>
                </div>
            </div>
            
            <div id="attendance" class="tab-content">
                <div class="card">
                    <h3>⏰ 출퇴근</h3>
                    <div style="display: flex; gap: 10px;">
                        <button class="btn btn-success" onclick="checkIn()" style="flex: 1;">✅ 출근</button>
                        <button class="btn btn-danger" onclick="checkOut()" style="flex: 1;">🚪 퇴근</button>
                    </div>
                    <div id="attendanceMsg" class="message" style="margin-top: 15px;"></div>
                    <table>
                        <thead>
                            <tr>
                                <th>날짜</th>
                                <th>출근</th>
                                <th>퇴근</th>
                                <th>상태</th>
                            </tr>
                        </thead>
                        <tbody id="attendanceList"></tbody>
                    </table>
                </div>
            </div>
            
            <div id="admin" class="tab-content">
                <div class="card">
                    <h3>⚙️ 관리자 도구</h3>
                    <button class="btn btn-secondary" onclick="downloadAllData()" style="width: 100%; margin-bottom: 10px;">📥 전체 데이터 다운로드 (JSON)</button>
                    <button class="btn btn-secondary" onclick="downloadAttendanceExcel()" style="width: 100%;">📊 출퇴근 데이터 (XLSX)</button>
                </div>
            </div>
        </div>
    </div>

    <script>
        let currentUser = null;
        let users = [];
        let attendance = [];
        
        const USERS_KEY = 'mvp_users_v9';
        const ATTENDANCE_KEY = 'mvp_attendance_v9';
        
        const categoryLabel = { A: 'A팀', B: 'B팀', C: 'C팀', D: 'D팀' };
        
        function load(key, fallback) {
            const raw = localStorage.getItem(key);
            if (!raw) {
                localStorage.setItem(key, JSON.stringify(fallback));
                return JSON.parse(JSON.stringify(fallback));
            }
            return JSON.parse(raw);
        }
        
        function save(key, value) {
            localStorage.setItem(key, JSON.stringify(value));
        }
        
        function init() {
            users = load(USERS_KEY, [
                { id: '관리자', password: 'admin1234', name: '관리자', role: 'admin', category: 'A', annualLeaveTotal: 15 },
                { id: '김수연', password: '1234', name: '김수연', role: 'worker', category: 'A', annualLeaveTotal: 15 },
                { id: '이준호', password: '1234', name: '이준호', role: 'worker', category: 'B', annualLeaveTotal: 15 }
            ]);
            attendance = load(ATTENDANCE_KEY, []);
        }
        
        function handleLogin() {
            const id = document.getElementById('loginId').value.trim();
            const pw = document.getElementById('loginPassword').value.trim();
            
            if (!id || !pw) {
                showMessage('loginMsg', '아이디와 비밀번호를 입력하세요', 'error');
                return;
            }
            
            const user = users.find(u => u.id === id && u.password === pw);
            if (!user) {
                showMessage('loginMsg', '아이디 또는 비밀번호가 잘못되었습니다', 'error');
                return;
            }
            
            currentUser = user;
            document.getElementById('authView').style.display = 'none';
            document.getElementById('appView').style.display = 'block';
            renderAll();
        }
        
        function handleLogout() {
            currentUser = null;
            document.getElementById('appView').style.display = 'none';
            document.getElementById('authView').style.display = 'flex';
            document.getElementById('loginId').value = '';
            document.getElementById('loginPassword').value = '';
        }
        
        function switchTab(event, tabName) {
            document.querySelectorAll('.tab-content').forEach(el => el.classList.remove('active'));
            document.querySelectorAll('.tab-btn').forEach(el => el.classList.remove('active'));
            document.getElementById(tabName).classList.add('active');
            event.target.classList.add('active');
        }
        
        function showMessage(elementId, msg, type) {
            const el = document.getElementById(elementId);
            el.textContent = msg;
            el.className = `message show ${type}`;
            setTimeout(() => el.classList.remove('show'), 5000);
        }
        
        async function checkIn() {
            const today = new Date().toISOString().split('T')[0];
            const existing = attendance.find(a => a.userId === currentUser.id && a.date === today);
            
            if (existing && existing.checkIn) {
                showMessage('attendanceMsg', '이미 출근했습니다', 'error');
                return;
            }
            
            const now = new Date();
            const time = `${String(now.getHours()).padStart(2, '0')}:${String(now.getMinutes()).padStart(2, '0')}`;
            
            if (existing) {
                existing.checkIn = time;
            } else {
                attendance.push({
                    userId: currentUser.id,
                    date: today,
                    checkIn: time,
                    checkOut: null,
                    status: '근무중'
                });
            }
            
            save(ATTENDANCE_KEY, attendance);
            renderAll();
            showMessage('attendanceMsg', '출근 처리되었습니다', 'success');
        }
        
        async function checkOut() {
            const today = new Date().toISOString().split('T')[0];
            const existing = attendance.find(a => a.userId === currentUser.id && a.date === today);
            
            if (!existing) {
                showMessage('attendanceMsg', '먼저 출근을 해주세요', 'error');
                return;
            }
            
            if (existing.checkOut) {
                showMessage('attendanceMsg', '이미 퇴근했습니다', 'error');
                return;
            }
            
            const now = new Date();
            const time = `${String(now.getHours()).padStart(2, '0')}:${String(now.getMinutes()).padStart(2, '0')}`;
            existing.checkOut = time;
            existing.status = '퇴근';
            
            save(ATTENDANCE_KEY, attendance);
            renderAll();
            showMessage('attendanceMsg', '퇴근 처리되었습니다', 'success');
        }
        
        function renderAll() {
            const today = new Date().toISOString().split('T')[0];
            const todayAttendance = attendance.find(a => a.userId === currentUser.id && a.date === today);
            
            document.getElementById('userInfo').textContent = `${currentUser.name} (${categoryLabel[currentUser.category] || '-'})`;
            document.getElementById('dashName').textContent = currentUser.name;
            document.getElementById('dashRole').textContent = currentUser.role === 'admin' ? '관리자' : '직원';
            document.getElementById('dashCategory').textContent = categoryLabel[currentUser.category] || '-';
            document.getElementById('dashCheckIn').textContent = todayAttendance?.checkIn || '-';
            document.getElementById('dashCheckOut').textContent = todayAttendance?.checkOut || '-';
            document.getElementById('dashStatus').textContent = todayAttendance?.status || '미기록';
            
            const userAttendance = attendance.filter(a => a.userId === currentUser.id).slice(-30);
            let html = '';
            userAttendance.forEach(a => {
                html += `<tr><td>${a.date}</td><td>${a.checkIn || '-'}</td><td>${a.checkOut || '-'}</td><td><span class="status-badge status-${a.status === '퇴근' ? 'approved' : 'pending'}">${a.status}</span></td></tr>`;
            });
            document.getElementById('attendanceList').innerHTML = html;
        }
        
        function downloadAllData() {
            const data = { users, attendance, exportedAt: new Date().toISOString() };
            const blob = new Blob([JSON.stringify(data, null, 2)], { type: 'application/json' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = `backup-${new Date().toISOString().split('T')[0]}.json`;
            a.click();
        }
        
        function downloadAttendanceExcel() {
            const sheet = attendance.map(a => ({
                '날짜': a.date,
                '직원': users.find(u => u.id === a.userId)?.name || '-',
                '출근': a.checkIn || '-',
                '퇴근': a.checkOut || '-',
                '상태': a.status || '-'
            }));
            
            const wb = XLSX.utils.book_new();
            XLSX.utils.book_append_sheet(wb, XLSX.utils.json_to_sheet(sheet), '출퇴근');
            XLSX.writeFile(wb, `attendance-${new Date().toISOString().split('T')[0]}.xlsx`);
        }
        
        init();
    </script>
</body>
</html>
